name: Validate Dropmac

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check theme.js
          node --check catalog.js
          node --check decision.js
          node --check app.js
          node --check drop-data.js
          node --check drop-v2.js
      - name: Check local references
        run: node check.mjs
